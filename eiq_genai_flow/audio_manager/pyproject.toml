[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio_manager"
version = "1.0.0"
description = "Unified Audio Manager for capture and playback with multiple backend support"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy==1.26.4; python_version <= '3.12'",
    "numpy==2.2.3; python_version >= '3.13'",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
alsa = ["pyalsaaudio==0.11.0"]
gstreamer = ["PyGObject==3.52.2"]
all = ["pyalsaaudio==0.11.0", "PyGObject==3.52.2"]

[tool.setuptools.packages.find]
where = ["src"]
