[project]
name = "VLM"
version = "1.1.0"
description = "VLM project with various quantized VLM support."
readme = "README.md"
authors = [
    { name = "NXP AI Software Team", email = "voice@nxp.com" }
]
license-files = ["LICENSE"]

dependencies = [
    "colorama==0.4.6",
    "transformers==5.12.1",
    "onnx==1.22.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "posix-ipc==1.3.2",
]

[project.optional-dependencies]
gui = ["nxp_eiq_chat_interface"]
onnxruntime = [
    "onnxruntime>=1.22.0"
]

[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[tool.distutils.egg_info]
egg_base = "."

[tool.setuptools.packages.find]
where = ["src", "gui/src"]
exclude = [
    "*.shared_utils",
    "*.shared_utils.*",
    "shared_utils.*"
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
